<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Centre — Kevin Lelitte</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --oxford:        #002147;
  --sidebar-bg:    #002147;
  --main-bg:       #f5f7fb;
  --card-bg:       #ffffff;
  --text-dark:     #1a2740;
  --text-muted:    #7a8a9e;
  --text-very-muted: #b0b8c8;
  --sidebar-width: 320px;

  --today-color:  #ef4444;
  --tomorrow-color: #f97316;
  --week-color:   #f59e0b;
  --parked-color: #94a3b8;

  --today-bg:   #fef2f2;
  --tomorrow-bg: #fff7ed;
  --week-bg:    #fffbeb;
  --parked-bg:  #f8fafc;

  --today-border:  #fca5a5;
  --tomorrow-border: #fdba74;
  --week-border:   #fcd34d;
  --parked-border: #cbd5e1;
}

html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--main-bg); color: var(--text-dark); }

/* ── LAYOUT ── */
.shell { display: flex; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-header {
  padding: 28px 22px 22px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

/* Oxford crest image */
.sidebar-shield {
  width: 72px;
  height: 72px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(255,255,255,0.18);
}

.sidebar-brand-text .brand-title {
  font-size: 16px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.2;
}
.sidebar-brand-text .brand-sub {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 4px;
}

.sidebar-user {
  font-size: 13px;
  color: rgba(255,255,255,0.42);
  letter-spacing: 0.01em;
}

/* summary stats */
.sidebar-stats {
  padding: 24px 22px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.stat-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.32);
  margin-bottom: 8px;
}

.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
}
.stat-row .stat-name {
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(255,255,255,0.72);
}
.stat-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.stat-dot.today  { background: var(--today-color); }
.stat-dot.tomorrow { background: var(--tomorrow-color); }
.stat-dot.week   { background: var(--week-color); }
.stat-dot.parked { background: var(--parked-color); }
.stat-count {
  font-weight: 700;
  font-size: 16px;
  color: rgba(255,255,255,0.9);
}

.sidebar-divider {
  margin: 22px 22px;
  border: none;
  border-top: 1px solid rgba(255,255,255,0.1);
}

/* quick add btn in sidebar */
.sidebar-quick-add {
  margin: 0 22px;
  padding: 12px 18px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s;
  font-family: 'Inter', sans-serif;
}
.sidebar-quick-add:hover { background: rgba(255,255,255,0.18); }

.sidebar-date {
  margin: 18px 22px 0;
  font-size: 12px;
  color: rgba(255,255,255,0.28);
}

/* ── MAIN ── */
.main {
  flex: 1;
  padding: 36px 40px;
  overflow-y: auto;
}

.main-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}

.main-greeting h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 4px;
}
.main-greeting .main-date {
  font-size: 14px;
  color: var(--text-muted);
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.btn {
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: 'Inter', sans-serif;
  transition: transform 0.12s, box-shadow 0.12s;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--oxford);
  color: #fff;
}
.btn-primary:hover { box-shadow: 0 4px 12px rgba(0,33,71,0.25); }

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid #d1d9e6;
}
.btn-ghost:hover { background: #edf0f6; color: var(--text-dark); }

/* ── SECTIONS ── */
.section { margin-bottom: 36px; }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.section-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
}
.section-dot.today  { background: var(--today-color); }
.section-dot.tomorrow { background: var(--tomorrow-color); }
.section-dot.week   { background: var(--week-color); }
.section-dot.parked { background: var(--parked-color); }

.section-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-dark);
  letter-spacing: 0.01em;
}

.section-count {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-very-muted);
  background: #edf0f6;
  border-radius: 20px;
  padding: 2px 10px;
}

.section-rule {
  flex: 1;
  height: 1px;
  background: #dde3ee;
}

/* ── TASK CARDS ── */
.task-list { display: flex; flex-direction: column; gap: 10px; }

.task-card {
  background: var(--card-bg);
  border-radius: 12px;
  border: 1px solid #e4eaf4;
  border-left-width: 4px;
  padding: 14px 18px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  transition: box-shadow 0.15s;
  box-shadow: 0 1px 3px rgba(0,33,71,0.05);
}
.task-card:hover { box-shadow: 0 4px 12px rgba(0,33,71,0.1); }

.task-card.tier-today  { border-left-color: var(--today-color); }
.task-card.tier-tomorrow { border-left-color: var(--tomorrow-color); }
.task-card.tier-week   { border-left-color: var(--week-color); }
.task-card.tier-parked { border-left-color: var(--parked-color); }

.task-card.done {
  opacity: 0.45;
}
.task-card.done .task-title {
  text-decoration: line-through;
  color: var(--text-very-muted);
}
.task-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; vertical-align:middle; margin-left:7px; letter-spacing:0.4px; }
.task-badge-new { background:#dcfce7; color:#15803d; }
.task-badge-updated { background:#dbeafe; color:#1d4ed8; }
.task-card.hidden { display: none; }

.title-edit-btn { background: none; border: none; color: var(--text-very-muted); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; opacity: 0; transition: opacity 0.12s; flex-shrink: 0; }
.task-card-top:hover .title-edit-btn { opacity: 1; }
.title-edit-btn:hover { background: #edf0f6; color: var(--text-dark); }
.title-edit { width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; color: var(--text-dark); border: 1px solid var(--oxford); border-radius: 6px; padding: 4px 8px; outline: none; }

/* ── DRAG AND DROP ── */
.drag-handle {
  cursor: grab;
  color: var(--text-very-muted);
  font-size: 15px;
  opacity: 0;
  transition: opacity 0.15s;
  user-select: none;
  padding: 2px 2px 2px 0;
  flex-shrink: 0;
  margin-top: 1px;
  letter-spacing: -2px;
}
.task-card:hover .drag-handle { opacity: 1; }
.task-card.dragging { opacity: 0.35; box-shadow: none; }
.task-card.drop-before { border-top: 2px solid var(--oxford) !important; }
.task-card.drop-after  { border-bottom: 2px solid var(--oxford) !important; }
.task-list.drop-target-empty {
  outline: 2px dashed #c4cdd8;
  outline-offset: -4px;
  border-radius: 10px;
  min-height: 56px;
  background: rgba(0,33,71,0.02);
}

/* checkbox */
.task-check {
  width: 18px; height: 18px;
  border-radius: 4px;
  border: 2px solid #c4cdd8;
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
  transition: background 0.15s, border-color 0.15s;
}
.task-check.checked {
  background: var(--oxford);
  border-color: var(--oxford);
}
.task-check.checked::after {
  content: '';
  width: 10px; height: 6px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translateY(-1px);
}

.task-body { flex: 1; min-width: 0; }

.task-title-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 5px;
}

.task-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dark);
  line-height: 1.4;
  flex: 1;
  min-width: 0;
}

.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-source {
  background: #e8edf8;
  color: #4a6080;
}

.task-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.task-notes {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
}
.task-email-ref {
  font-size: 12px;
  color: var(--text-very-muted);
  font-style: italic;
}
.task-date {
  font-size: 11px;
  color: var(--text-very-muted);
  margin-left: auto;
  flex-shrink: 0;
}

.empty-state {
  text-align: center;
  padding: 28px 20px;
  color: var(--text-very-muted);
  font-size: 13px;
  background: var(--card-bg);
  border-radius: 12px;
  border: 1px dashed #d1d9e6;
}

/* ── EXPAND / COLLAPSE ── */
.task-card { flex-direction: column; gap: 0; padding: 0; }

.task-card-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 18px;
  cursor: pointer;
  border-radius: inherit;
  transition: background 0.1s;
}
.task-card-top:hover { background: #f7f9fd; }

.task-expand-btn {
  margin-left: auto;
  flex-shrink: 0;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-very-muted);
  font-size: 12px;
  border-radius: 4px;
  transition: background 0.12s, color 0.12s, transform 0.2s;
  margin-top: 0px;
}
.task-card-top:hover .task-expand-btn { background: #edf0f6; color: var(--text-muted); }
.task-card.expanded .task-expand-btn { transform: rotate(180deg); color: var(--oxford); }

/* detail drawer */
.task-drawer {
  display: none;
  border-top: 1px solid #edf0f7;
  padding: 14px 18px 16px 50px;
  background: #fafbfd;
  border-radius: 0 0 12px 12px;
}
.task-card.expanded .task-drawer { display: block; }

/* what you need to do */
.drawer-actions-list {
  list-style: none;
  margin: 0 0 14px 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.drawer-actions-list li {
  font-size: 13px;
  color: var(--text-dark);
  line-height: 1.5;
  padding-left: 18px;
  position: relative;
}
.drawer-actions-list li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--oxford);
  font-size: 12px;
  top: 1px;
  opacity: 0.6;
}
.drawer-divider {
  border: none;
  border-top: 1px solid #eaeef5;
  margin: 12px 0 14px;
}

.drawer-grid {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 8px 16px;
  margin-bottom: 14px;
}
.drawer-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-very-muted);
  padding-top: 1px;
}
.drawer-value {
  font-size: 13px;
  color: var(--text-dark);
  line-height: 1.45;
}
.drawer-value.empty { color: var(--text-very-muted); font-style: italic; }

.drawer-edit-description {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid #d1d9e6;
  border-radius: 6px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  color: var(--text-dark);
  background: #fff;
  resize: vertical;
  min-height: 52px;
  outline: none;
  transition: border-color 0.15s;
}
.drawer-edit-description:focus { border-color: var(--oxford); }

.drawer-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.drawer-move-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-very-muted);
  margin-right: 2px;
}
.move-btn {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid #d1d9e6;
  background: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  color: var(--text-muted);
  transition: all 0.12s;
}
.move-btn:hover { background: #edf0f6; color: var(--text-dark); border-color: #b0b8c8; }
.move-btn.active { background: var(--oxford); color: #fff; border-color: var(--oxford); cursor: default; }
.save-description-btn {
  margin-left: auto;
  padding: 5px 14px;
  border-radius: 6px;
  border: none;
  background: var(--oxford);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}
.save-description-btn.visible { opacity: 1; pointer-events: auto; }

/* ── QUICK-ADD PANEL ── */
.panel-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 100;
  align-items: flex-end;
  justify-content: flex-end;
}
.panel-overlay.open { display: flex; }

.add-panel {
  background: var(--card-bg);
  width: 380px;
  max-width: 100vw;
  margin: 20px;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,33,71,0.2);
}

.panel-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 20px;
}

.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #d1d9e6;
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: var(--text-dark);
  background: #fafbfd;
  transition: border-color 0.15s;
  outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--oxford);
  background: #fff;
}
.form-textarea { resize: vertical; min-height: 64px; }

.tier-picker {
  display: flex;
  gap: 8px;
}
.tier-option {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: 2px solid #e4eaf4;
  background: transparent;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  color: var(--text-muted);
  transition: all 0.15s;
  text-align: center;
}
.tier-option.selected-today  { border-color: var(--today-color);  color: var(--today-color);  background: var(--today-bg); }
.tier-option.selected-tomorrow { border-color: var(--tomorrow-color); color: var(--tomorrow-color); background: var(--tomorrow-bg); }
.tier-option.selected-week   { border-color: var(--week-color);   color: var(--week-color);   background: var(--week-bg); }
.tier-option.selected-parked { border-color: var(--parked-color); color: var(--parked-color); background: var(--parked-bg); }

.panel-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.panel-actions .btn { flex: 1; }

/* -- INBOX WIDGET -- */
.sidebar-inbox{margin:18px 22px 0;padding:14px 0 0;border-top:1px solid rgba(255,255,255,0.1)}
.sidebar-inbox-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-bottom:8px}
.sidebar-inbox-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:5px}
.sidebar-inbox-name{color:rgba(255,255,255,.72)}
.sidebar-inbox-count{font-weight:700;color:rgba(255,255,255,.9)}
.sidebar-inbox-refreshed{font-size:11px;color:rgba(255,255,255,.28);margin-bottom:8px}
.sidebar-inbox-vip{font-size:12px;margin-top:4px;color:#fbbf24;font-weight:600}
.sidebar-inbox-unavailable{font-size:12px;color:rgba(255,255,255,.28);font-style:italic}
/* -- INBOX SUGGESTIONS -- */
.sg-section{margin-bottom:36px}
.sg-card{cursor:grab;background:#fff;border:1px solid #e4eaf4;border-left:4px solid #378add;border-radius:12px;padding:14px 18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,33,71,0.05)}
.sg-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sg-tier{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.sg-tier-today{background:var(--today-bg);color:var(--today-color);border:1px solid var(--today-border)}
.sg-tier-tomorrow{background:var(--tomorrow-bg);color:var(--tomorrow-color);border:1px solid var(--tomorrow-border)}
.sg-tier-week{background:var(--week-bg);color:var(--week-color);border:1px solid var(--week-border)}
.sg-title{font-size:14px;font-weight:600;color:var(--text-dark);flex:1;min-width:0}
.sg-desc{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:8px}
.sg-meta{font-size:12px;color:var(--text-very-muted);margin-bottom:10px}
.sg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sg-btn{padding:5px 12px;border-radius:20px;border:1px solid #d1d9e6;background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;color:var(--text-muted);transition:all .12s}
.sg-btn:hover{background:#edf0f6;color:var(--text-dark);border-color:#b0b8c8}
.sg-hint{font-size:11px;color:var(--text-very-muted);margin-left:auto;font-style:italic}
.sg-update{background:#fff;border:1px solid #e4eaf4;border-radius:12px;padding:10px 18px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sg-update-text{flex:1;min-width:200px;color:var(--text-dark);line-height:1.45}
.sg-stamp{font-size:11px;color:var(--text-very-muted);margin:-6px 0 14px 24px}
.sg-stale{color:#c2410c;font-weight:600}
</style>
</head>
<body>

<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-date" id="sidebarDate"></div>
  
    <div class="sidebar-inbox">

  <!-- MAIN -->
  <main class="main">

<!-- QUICK-ADD PANEL -->
<div class="panel-overlay" id="panelOverlay" onclick="handleOverlayClick(event)">
  <div class="add-panel" id="addPanel">
    <div class="panel-title">Add Task</div>

    <div class="form-group">

        <button class="tier-option" data-tier="tomorrow" onclick="selectTier('tomorrow')">🟠 Tomorrow</button>

<script>
// ── STATE ──
let tasks = [];
let tasksDoc = { tasks: [] };
let sgDragIdx = null;
let doneVisible = true;
let selectedTier = 'today';
const DONE_KEY = 'commandCentre_done_v1';
const expandedIds = new Set();

// ── DRAG AND DROP ──
const ORDER_KEY = 'commandCentre_order_v1';
let customOrder = { today: [], tomorrow: [], week: [], parked: [] };
let dragSrcId   = null;
let dropPos     = 'after';

function loadOrder() {
  try {
    const saved = JSON.parse(localStorage.getItem(ORDER_KEY) || '{}');
    if (saved.today)  customOrder.today  = saved.today;
    if (saved.tomorrow) customOrder.tomorrow = saved.tomorrow;
    if (saved.week)   customOrder.week   = saved.week;
    if (saved.parked) customOrder.parked = saved.parked;
  } catch(e) {}
}

function saveOrder() {
  ['today','tomorrow','week','parked'].forEach(tier => {
    const ids = tasks.filter(t => t.tier === tier).map(t => t.id);
    customOrder[tier] = [
      ...customOrder[tier].filter(id => ids.includes(id)),
      ...ids.filter(id => !customOrder[tier].includes(id))
    ];
  });
  localStorage.setItem(ORDER_KEY, JSON.stringify(customOrder));
}

function getOrderedTasks(tier) {
  const tierTasks = tasks.filter(t => t.tier === tier);
  const order = customOrder[tier] || [];
  return tierTasks.sort((a, b) => {
    const ai = order.indexOf(a.id);
    const bi = order.indexOf(b.id);
    if (ai < 0 && bi < 0) return 0;
    if (ai < 0) return 1;
    if (bi < 0) return -1;
    return ai - bi;
  });
}

function clearDragStyles() {
  document.querySelectorAll('.task-card').forEach(c =>
    c.classList.remove('dragging','drop-before','drop-after'));
  document.querySelectorAll('.task-list').forEach(l =>
    l.classList.remove('drop-target-empty'));
}

function onCardDragStart(e, id) {
  sgDragIdx = null;
  dragSrcId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => {
    const el = document.querySelector('[data-id="' + id + '"]');
    if (el) el.classList.add('dragging');
  }, 0);
}

function onCardDragEnd() {
  clearDragStyles();
  dragSrcId = null;
}

function onCardDragOver(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  if (!dragSrcId || dragSrcId === targetId) return;
  document.querySelectorAll('.task-card').forEach(c =>
    c.classList.remove('drop-before','drop-after'));
  const card = document.querySelector('[data-id="' + targetId + '"]');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  dropPos = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
  card.classList.add(dropPos === 'before' ? 'drop-before' : 'drop-after');
}

function onCardDragLeave(e) {
  e.currentTarget.classList.remove('drop-before','drop-after');
}

function onCardDrop(e, targetId, targetTier) {
  e.preventDefault();
  e.stopPropagation();
  if (sgDragIdx !== null) { addSuggestionAsTask(sgDragIdx, targetTier); return; }
  if (!dragSrcId || dragSrcId === targetId) return;
  const src = tasks.find(t => t.id === dragSrcId);
  if (!src) return;
  const oldTier = src.tier;
  src.tier = targetTier;
  saveOrder();
  const arr = customOrder[targetTier];
  const si  = arr.indexOf(dragSrcId);
  if (si > -1) arr.splice(si, 1);
  const ti = arr.indexOf(targetId);
  arr.splice(Math.max(0, dropPos === 'before' ? ti : ti + 1), 0, dragSrcId);
  if (oldTier !== targetTier) {
    customOrder[oldTier] = customOrder[oldTier].filter(id => id !== dragSrcId);
    persistTasks('Move task to ' + targetTier);
  }
  localStorage.setItem(ORDER_KEY, JSON.stringify(customOrder));
  clearDragStyles();
  render();
}

function onListDragOver(e, tier) {
  e.preventDefault();
  const listId = { today: 'todayList', tomorrow: 'tomorrowList', week: 'weekList', parked: 'parkedList' }[tier];
  const tierTasks = tasks.filter(t => t.tier === tier);
  if (tierTasks.length === 0) document.getElementById(listId).classList.add('drop-target-empty');
}

function onListDragLeave(e) {
  e.currentTarget.classList.remove('drop-target-empty');
}

function onListDrop(e, tier) {
  e.preventDefault();
  if (sgDragIdx !== null) { addSuggestionAsTask(sgDragIdx, tier); return; }
  if (!dragSrcId) return;
  const src = tasks.find(t => t.id === dragSrcId);
  if (!src || src.tier === tier) { clearDragStyles(); return; }
  const oldTier = src.tier;
  src.tier = tier;
  saveOrder();
  customOrder[oldTier] = customOrder[oldTier].filter(id => id !== dragSrcId);
  if (!customOrder[tier].includes(dragSrcId)) customOrder[tier].push(dragSrcId);
  persistTasks('Move task to ' + tier);
  localStorage.setItem(ORDER_KEY, JSON.stringify(customOrder));
  clearDragStyles();
  render();
}

// ── INIT ──
async function init() {
  loadOrder();
  setGreetingAndDate();
  await loadTasks();
  loadDoneState();
  render();
  if (typeof loadInboxSuggestions === 'function') loadInboxSuggestions();
}

function setGreetingAndDate() {
  const now = new Date();
  const hour = now.getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  document.getElementById('greeting').textContent = `${greet}, Kevin`;

  const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  const dateStr = now.toLocaleDateString('en-GB', opts);
  document.getElementById('mainDate').textContent = dateStr;
  document.getElementById('sidebarDate').textContent = dateStr;

  // week label
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  document.getElementById('weekLabel').textContent = monday.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

async function loadTasks() {
  try {
    const res = await fetch('data/tasks.json?_=' + Date.now());
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    tasksDoc = data;
    tasks = data.tasks || [];
  } catch (e) {
    console.warn('Could not load tasks.json — starting empty', e);
    tasks = [];
  }
}

function loadDoneState() {
  try {
    const saved = JSON.parse(localStorage.getItem(DONE_KEY) || '{}');
    tasks.forEach(t => { if (saved[t.id]) t.done = true; });
  } catch(e) {}
}

function saveDoneState() {
  const state = {};
  tasks.forEach(t => { if (t.done) state[t.id] = true; });
  localStorage.setItem(DONE_KEY, JSON.stringify(state));
}

// ── RENDER ──
function taskBadge(task) {
  const today = new Date().toISOString().slice(0, 10);
  const d = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const todayPrefix = '[' + String(d.getDate()).padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ']';
  if (task.dateAdded === today) return '<span class="task-badge task-badge-new">NEW</span>';
  if (task.actions && task.actions.some(a => a.startsWith(todayPrefix))) return '<span class="task-badge task-badge-updated">UPDATED</span>';
  return '';
}
function render() {
  const tiers = ['today', 'tomorrow', 'week', 'parked'];
  const listIds = { today: 'todayList', tomorrow: 'tomorrowList', week: 'weekList', parked: 'parkedList' };
  const countIds = { today: 'todayCount', tomorrow: 'tomorrowCount', week: 'weekCount', parked: 'parkedCount' };
  const sidebarIds = { today: 'countToday', tomorrow: 'countTomorrow', week: 'countWeek', parked: 'countParked' };

  tiers.forEach(tier => {
    const tierTasks = getOrderedTasks(tier);
    const total = tierTasks.length;
    const pending = tierTasks.filter(t => !t.done).length;

    document.getElementById(countIds[tier]).textContent = `${pending} of ${total}`;
    document.getElementById(sidebarIds[tier]).textContent = pending;

    const list = document.getElementById(listIds[tier]);
    list.innerHTML = '';

    if (tierTasks.length === 0) {
      list.innerHTML = '<div class="empty-state">No tasks in this tier</div>';
      return;
    }

    tierTasks.forEach(task => {
      const isExpanded = expandedIds.has(task.id);
      const card = document.createElement('div');
      card.className = `task-card tier-${tier}${task.done ? ' done' : ''}${(!doneVisible && task.done) ? ' hidden' : ''}${isExpanded ? ' expanded' : ''}`;
      card.dataset.id = task.id;

      const tierLabels = { today: '🔴 Today', tomorrow: '🟠 Tomorrow', week: '🟡 This Week', parked: '⚪ Parked' };
      const otherTiers = ['today','tomorrow','week','parked'].filter(t => t !== tier);

      card.innerHTML = `
        <div class="task-card-top" onclick="toggleExpand('${task.id}')">
          <div class="drag-handle" title="Drag to reorder">⣿⣿</div>
          <div class="task-check${task.done ? ' checked' : ''}" onclick="event.stopPropagation(); toggleTask('${task.id}')"></div>
          <div class="task-body">
            <div class="task-title-row">
              <div class="task-title" id="title-${task.id}">${escHtml(task.title)}</div>
              ${taskBadge(task)}
              <button class="title-edit-btn" title="Rename task" onclick="editTitle('${task.id}', event)">✎</button>
            </div>
          </div>
          ${task.entryId ? `<button class="sg-btn" style="flex-shrink:0;margin-left:auto" onclick="openTaskEmail('${task.entryId}', event)">📧 Open email</button>` : ''}
          <div class="task-expand-btn">▼</div>
        </div>
        <div class="task-drawer">
          ${task.actions && task.actions.length ? `
          <ul class="drawer-actions-list">
            ${task.actions.map(a => `<li>${escHtml(a)}</li>`).join('')}
          </ul>
          <hr class="drawer-divider">` : ''}
          <div class="drawer-grid">
            <span class="drawer-label">Source</span>
            <span class="drawer-value${task.source ? '' : ' empty'}">${task.source ? escHtml(task.source) : 'None'}</span>
            ${task.emailRef ? `<span class="drawer-label">Email ref</span><span class="drawer-value">${escHtml(task.emailRef)}</span>` : ''}
            <span class="drawer-label">Added</span>
            <span class="drawer-value">${formatDate(task.dateAdded)}</span>
            <span class="drawer-label">Notes</span>
            <span class="drawer-value" style="width:100%">
              <textarea class="drawer-edit-description" id="notes-${task.id}" oninput="notesChanged('${task.id}')">${escHtml(task.description || '')}</textarea>
            </span>
          </div>
          <div class="drawer-actions">
            <span class="drawer-move-label">Move to:</span>
            ${otherTiers.map(t => `<button class="move-btn" onclick="moveTask('${task.id}','${t}'">${tierLabels[t]}</button>`).join('')}
            ${task.entryId ? `<button class="move-btn" onclick="openTaskEmail('${task.entryId}', event)">📧 Open email</button>` : ''}
            <button class="save-description-btn" id="save-${task.id}" onclick="saveDescription('${task.id}')">Save notes</button>
          </div>
        </div>
      `;
      card.draggable = true;
      card.addEventListener('dragstart', e => onCardDragStart(e, task.id));
      card.addEventListener('dragend',   () => onCardDragEnd());
      card.addEventListener('dragover',  e => onCardDragOver(e, task.id));
      card.addEventListener('dragleave', e => onCardDragLeave(e));
      card.addEventListener('drop',      e => onCardDrop(e, task.id, tier));
      list.appendChild(card);
    });
  });
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function editTitle(id, ev) {
  if (ev) ev.stopPropagation();
  const task = tasks.find(t => t.id === id);
  const el = document.getElementById('title-' + id);
  if (!task || !el || el.querySelector('input')) return;
  const old = task.title;
  el.innerHTML = '<input class="title-edit" value="' + escAttr(old) + '">';
  const inp = el.querySelector('input');
  inp.focus(); inp.select();
  inp.addEventListener('click', e => e.stopPropagation());
  inp.addEventListener('click', e => e.stopPropagation());
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') inp.blur();
    if (e.key === 'Escape') { inp.value = old; inp.blur(); }
  });
  inp.addEventListener('blur', () => {
    const v = inp.value.trim();
    if (v && v !== old) { task.title = v; persistTasks('Rename: ' + v); }
    render();
  });
}

function mergeRemote(remote) {
  // Adopt changes that landed on GitHub after this page loaded, so a save
  // from a stale page never wipes them. Local wins on tier/title/description
  // (the user just touched those); actions are unioned; remotely-added tasks kept.
  if (!remote || !Array.isArray(remote.tasks)) return false;
  let changed = false;
  const localById = {};
  tasks.forEach(t => localById[t.id] = t);
  remote.tasks.forEach(rt => {
    const lt = localById[rt.id];
    if (!lt) { tasks.push(rt); changed = true; return; }
    const ra = rt.actions || [], la = lt.actions || [];
    const merged = ra.slice();
    la.forEach(a => { if (!merged.includes(a)) merged.push(a); });
    if (merged.length !== la.length || merged.some((a, i) => a !== la[i])) changed = true;
    lt.actions = merged;
    if (rt.entryId && !lt.entryId) { lt.entryId = rt.entryId; changed = true; }
  });
  return changed;
}

function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(day)} ${months[parseInt(m)-1]}`;
}

// ── INTERACTIONS ──
function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;
  saveDoneState();
  persistTasks((task.done ? 'Mark done: ' : 'Reopen: ') + task.title);
  render();
}

function toggleDone() {
  doneVisible = !doneVisible;
  document.getElementById('toggleDoneBtn').textContent = doneVisible ? 'Hide Done' : 'Show Done';
  render();
}

function toggleExpand(id) {
  if (expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);
  render();
}

function moveTask(id, newTier) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  expandedIds.delete(id);
  task.tier = newTier;
  persistTasks('Move task to ' + newTier);
  render();
}

function notesChanged(id) {
  const btn = document.getElementById('save-' + id);
  if (btn) btn.classList.add('visible');
}

function saveDescription(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const ta = document.getElementById('notes-' + id);
  if (ta) task.description = ta.value.trim();
  persistTasks('Edit notes: ' + (task.title || id));
  const btn = document.getElementById('save-' + id);
  if (btn) btn.classList.remove('visible');
}

// ── QUICK-ADD PANEL ──
function openPanel() {
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('newTitle').focus();
}

function closePanel() {
  document.getElementById('panelOverlay').classList.remove('open');
  clearPanel();
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('panelOverlay')) closePanel();
}

function selectTier(tier) {
  selectedTier = tier;
  document.querySelectorAll('.tier-option').forEach(btn => {
    btn.className = 'tier-option';
    if (btn.dataset.tier === tier) btn.classList.add(`selected-${tier}`);
  });
}

function clearPanel() {
  document.getElementById('newTitle').value = '';
  document.getElementById('newSource').value = 'Manual';
  document.getElementById('newEmailRef').value = '';
  document.getElementById('newNotes').value = '';
  selectTier('today');
}

function addTask() {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) { document.getElementById('newTitle').focus(); return; }

  const newTask = {
    id: 't' + Date.now(),
    title,
    tier: selectedTier,
    source: document.getElementById('newSource').value.trim() || 'Manual',
    emailRef: document.getElementById('newEmailRef').value.trim(),
    description: document.getElementById('newNotes').value.trim(),
    actions: [],
    dateAdded: new Date().toISOString().slice(0, 10),
    done: false
  };

  tasks.push(newTask);
  persistTasks('Add task: ' + title);
  closePanel();
  render();
}

// ── GITHUB WRITE-BACK ──
const CC_WRITER_URL = 'https://cc-tasks-writer.kevinlelitte.workers.dev';
localStorage.removeItem('commandCentre_pat_v1');
let persistTimer = null;
let persistQueue = [];

function persistTasks(reason) {
  persistQueue.push(reason);
  clearTimeout(persistTimer);
  persistTimer = setTimeout(doPersist, 900);
}

async function doPersist() {
  const reasons = persistQueue.splice(0).join('; ');
  if (!reasons) return;
  try {
    try {
      const cur = await (await fetch('https://api.github.com/repos/begb0037admin/command-centre/contents/data/tasks.json?t=' + Date.now(),
        { headers: { 'Accept': 'application/vnd.github.raw+json' } })).json();
      if (mergeRemote(cur)) render();
    } catch (e2) { console.warn('merge check skipped', e2); }
    tasksDoc.tasks = tasks;
    const res = await fetch(CC_WRITER_URL, { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: reasons, doc: tasksDoc }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error || ('HTTP ' + res.status));
    console.log('Saved to GitHub:', reasons, out.commit || '');
    ccNotify('Saved to GitHub ✓');
  } catch (err) {
    console.warn('Save failed', err);
    ccNotify('Not saved to GitHub - change is local only. ' + (err.message || ''));
  }
}

function ccNotify(msg) {
  let el = document.getElementById('ccToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ccToast';
    el.style.cssText = 'position:fixed;bottom:18px;right:18px;max-width:340px;background:#1a2740;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);line-height:1.45';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 7000);
}

function addSuggestionAsTask(idx, tier) {
  const s = (window.sgList || [])[idx];
  sgDragIdx = null;
  clearDragStyles();
  if (!s) return;
  const stamp = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  tasks.push({
    id: 't' + Date.now(),
    title: s.title,
    tier: tier,
    source: 'Inbox ' + (s.received || ''),
    emailRef: s.email_subject || '',
    entryId: s.entry_id || '',
    description: s.description || '',
    actions: ['[' + stamp + '] Created from inbox suggestion (email from ' + (s.email_from || '') + ')'],
    dateAdded: new Date().toISOString().slice(0, 10)
  });
  if (typeof dismissSuggestion === 'function') dismissSuggestion('n_' + s.entry_id);
  persistTasks('Add from inbox: ' + s.title);
  render();
}

function openTaskEmail(entryId, ev) {
  if (ev) ev.stopPropagation();
  window.location.href = 'openmail://' + entryId;
}

// keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});

init();
</script>

<script>
async function loadInboxWidget(){
  var el=document.getElementById('inboxWidgetContent');
  if(!el)return;
  try{
    var res=await fetch('https://raw.githubusercontent.com/begb0037admin/work-inbox/main/data/briefing.json?_='+Date.now());
    if(!res.ok)throw new Error('fetch failed');
    var data=await res.json();
    var urgentCount=(data.urgent||[]).length;
    var needsCount=(data.needs||[]).length;
    var vipNames=['Simon Burford','Marie Cooksey'];
    var allItems=[].concat(data.urgent||[]).concat(data.needs||[]);
    var vipCount=allItems.filter(function(item){return vipNames.some(function(name){return (item.title||'').includes(name)||(item.sub||'').includes(name);});}).length;
    var refreshed=data.refreshed_at||'Unknown';
    var html='<div class="sidebar-inbox-refreshed">Last briefed: '+refreshed+'</div>';
    html+='<div class="sidebar-inbox-row"><span class="sidebar-inbox-name">&#128308; Urgent</span><span class="sidebar-inbox-count">'+urgentCount+'</span></div>';
    html+='<div class="sidebar-inbox-row"><span class="sidebar-inbox-name">&#128993; Needs</span><span class="sidebar-inbox-count">'+needsCount+'</span></div>';
    if(vipCount>0){html+='<div class="sidebar-inbox-vip">&#9888;&#65039; VIP &nbsp;'+vipCount+'</div>';}
    el.innerHTML=html;
  }catch(e){el.innerHTML='<div class="sidebar-inbox-unavailable">Inbox unavailable</div>';}
}
loadInboxWidget();
</script>
<script>
var SG_DISMISS_KEY='commandCentre_dismissedSuggestions_v1';
function sgDismissed(){try{return JSON.parse(localStorage.getItem(SG_DISMISS_KEY)||'{}')}catch(e){return{}}}
function dismissSuggestion(key){var d=sgDismissed();d[key]=true;localStorage.setItem(SG_DISMISS_KEY,JSON.stringify(d));loadInboxSuggestions();}
function normSubj(s){return (s||'').toLowerCase().replace(/^((re|fw|fwd)\s*:\s*)+/,'').replace(/\s+/g,' ').trim();}
function suggestionCovered(s){
  var ns=normSubj(s.email_subject);
  return (tasks||[]).some(function(t){
    if(t.entryId&&s.entry_id&&t.entryId===s.entry_id) return true;
    return !!ns&&normSubj(t.emailRef)===ns;
  });
}
async function loadInboxSuggestions(){
  var host=document.getElementById('inboxSuggestions');
  if(!host)return;
  try{
    var res=await fetch('https://raw.githubusercontent.com/begb0037admin/work-inbox/main/data/inbox_suggestions.json?_='+Date.now());
    if(!res.ok)throw new Error('fetch failed');
    var data=await res.json();
    var d=sgDismissed();
    var newTasks=(data.new_tasks||[]).filter(function(s){return !d['n_'+s.entry_id]&&!suggestionCovered(s)});
    window.sgList=newTasks;
    if(!newTasks.length){host.innerHTML='';return;}
    var stale=false;
    try{stale=(Date.now()-new Date((data.generated_at||'').replace(' ','T')).getTime())>24*3600*1000}catch(e){}
    var tierChip={today:'<span class="sg-tier sg-tier-today">&#128308; Today</span>',tomorrow:'<span class="sg-tier sg-tier-tomorrow">&#128992; Tomorrow</span>',week:'<span class="sg-tier sg-tier-week">&#128993; This Week</span>'};
    var h='<div class="section sg-section"><div class="section-header"><span class="section-dot" style="background:#378add"></span><span class="section-title">From your inbox</span><span class="section-count">'+newTasks.length+'</span><span class="section-rule"></span></div>';
    h+='<div class="sg-stamp'+(stale?' sg-stale':'')+'">Suggested '+escHtml(data.generated_at||'')+(stale?' &mdash; stale, briefing needs a refresh':'')+' &middot; drag a card into a list below to add it as a task</div>';
    newTasks.forEach(function(s,i){
      h+='<div class="sg-card" draggable="true" ondragstart="sgDragIdx='+i+'" ondragend="sgDragIdx=null;clearDragStyles()">'
        +'<div class="sg-title-row">'+(tierChip[s.tier]||tierChip.week)+'<span class="sg-title">'+escHtml(s.title)+'</span></div>'
        +'<div class="sg-desc">'+escHtml(s.description)+'</div>'
        +'<div class="sg-meta">From '+escHtml(s.email_from)+' &middot; &quot;'+escHtml(s.email_subject)+'&quot; &middot; '+escHtml(s.received||'')+'</div>'
        +'<div class="sg-actions"><button class="sg-btn" onclick="openTaskEmail(\''+s.entry_id+'\', event)">&#128231; Open email</button>'
        +'<button class="sg-btn" onclick="dismissSuggestion(\'n_'+s.entry_id+'\')" >Dismiss</button>'
        +'<span class="sg-hint">drag into Today / Tomorrow / This Week to add</span></div></div>';
    });
    h+='</div>';
    host.innerHTML=h;
  }catch(e){host.innerHTML='';}
}
loadInboxSuggestions();
</script></body>
</html>
